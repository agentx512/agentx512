<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#132018"/>
      <stop offset="55%" stop-color="#0a0f0c"/>
      <stop offset="100%" stop-color="#05080600"/>
    </radialGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173626"/>
      <stop offset="100%" stop-color="#0a1712"/>
    </linearGradient>
    <linearGradient id="sat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#22e8c4"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#050806"/>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#eafff4">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="80" cy="320" r="1.3" opacity="0.6"/>
    <circle cx="340" cy="60" r="1.1" opacity="0.4"/>
    <circle cx="190" cy="430" r="1.6" opacity="0.7"/>
    <circle cx="410" cy="260" r="1.1" opacity="0.5"/>
    <circle cx="60" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="500" cy="140" r="1.4" opacity="0.6"/>
    <circle cx="620" cy="70" r="1.1" opacity="0.4"/>
    <circle cx="720" cy="200" r="1.6" opacity="0.7"/>
    <circle cx="900" cy="110" r="1.1" opacity="0.5"/>
    <circle cx="1020" cy="60" r="1.3" opacity="0.6"/>
    <circle cx="1150" cy="150" r="1.1" opacity="0.4"/>
    <circle cx="1280" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="1360" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="1080" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="960" cy="380" r="1.1" opacity="0.4"/>
    <circle cx="1220" cy="420" r="1.6" opacity="0.6"/>
    <circle cx="1380" cy="470" r="1.1" opacity="0.5"/>
    <circle cx="140" cy="560" r="1.1" opacity="0.4"/>
    <circle cx="60" cy="700" r="1.4" opacity="0.5"/>
    <circle cx="260" cy="650" r="1.1" opacity="0.4"/>
    <circle cx="380" cy="740" r="1.6" opacity="0.6"/>
    <circle cx="500" cy="680" r="1.1" opacity="0.4"/>
    <circle cx="200" cy="800" r="1.1" opacity="0.4"/>
    <circle cx="90" cy="850" r="1.3" opacity="0.5"/>
  </g>

  <!-- orbit rings -->
  <ellipse cx="980" cy="470" rx="430" ry="170" fill="none" stroke="#39ff88" stroke-opacity="0.22" stroke-width="1.5" transform="rotate(-18 980 470)"/>
  <ellipse cx="980" cy="470" rx="330" ry="128" fill="none" stroke="#22e8c4" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(-18 980 470)"/>

  <!-- planet -->
  <circle cx="980" cy="470" r="150" fill="url(#planet)" stroke="#39ff88" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="930" cy="420" r="26" fill="#0a0f0c" opacity="0.5"/>
  <circle cx="1030" cy="500" r="16" fill="#0a0f0c" opacity="0.4"/>
  <circle cx="1000" cy="410" r="10" fill="#0a0f0c" opacity="0.4"/>
  <path d="M 840 470 A 150 150 0 0 1 1120 470" fill="none" stroke="#39ff88" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- satellite (probe) riding the outer orbit, upper-left of planet -->
  <g transform="translate(636 300) rotate(-24)">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="url(#sat)"/>
    <rect x="-40" y="-3" width="26" height="6" fill="#22e8c4" fill-opacity="0.85"/>
    <rect x="14" y="-3" width="26" height="6" fill="#22e8c4" fill-opacity="0.85"/>
    <line x1="0" y1="-7" x2="0" y2="-20" stroke="#39ff88" stroke-width="1.5"/>
    <circle cx="0" cy="-22" r="2.4" fill="#39ff88"/>
  </g>

  <!-- crosshair / targeting mark echoing the site's logo motif -->
  <g stroke="#39ff88" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="300" cy="620" r="34" fill="none"/>
    <line x1="300" y1="574" x2="300" y2="596"/>
    <line x1="300" y1="644" x2="300" y2="666"/>
    <line x1="254" y1="620" x2="276" y2="620"/>
    <line x1="324" y1="620" x2="346" y2="620"/>
  </g>
  <circle cx="300" cy="620" r="2.5" fill="#39ff88"/>

  <!-- label plate -->
  <text x="64" y="792" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#39ff88" opacity="0.92">NASA SPACE APPS CHALLENGE</text>
  <text x="64" y="818" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12.5" letter-spacing="1.5" fill="#8fb3a3">TEAM &quot;MILLER&quot; &#183; 48H BUILD &#183; 6TH / 32 TEAMS</text>
  <line x1="64" y1="736" x2="220" y2="736" stroke="#39ff88" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
